<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scrolling Gallery</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #111;
  color: white;
  overflow-x: hidden;
}


/* Gallery Wrapper */
.gallery-wrapper {
  overflow: hidden;
  position: relative;
  width: 100%;
}

/* Sliding Track */
.gallery-track {
  display: flex;
  gap: 20px;
  animation: scroll 25s linear infinite;
}

.gallery-track img {
  height: 250px;
  width: 400px;
  object-fit: cover;
  border-radius: 15px;
  cursor: pointer;
  transition: transform 0.4s ease;
}

.gallery-track img:hover {
  transform: scale(1.05);
}

/* Infinite Scroll Animation */
@keyframes scroll {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

/* Fullscreen Modal */
.fullscreen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.95);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 1000;
}

.fullscreen img {
  max-width: 95%;
  max-height: 90%;
  border-radius: 15px;
  animation: zoomIn 0.4s ease;
}

@keyframes zoomIn {
  from { transform: scale(0.6); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.fullscreen.active {
  display: flex;
}

.close-btn {
  position: absolute;
  top: 30px;
  right: 40px;
  font-size: 40px;
  color: white;
  cursor: pointer;
}
</style>

</head>
<body>

<h1>Resort Experience</h1>

<div class="gallery-wrapper">
  <div class="gallery-track">
    <!-- Duplicate images for smooth infinite scroll -->
    <img src="https://picsum.photos/800/500?random=1">
    <img src="https://picsum.photos/800/500?random=2">
    <img src="https://picsum.photos/800/500?random=3">
    <img src="https://picsum.photos/800/500?random=4">
    <img src="https://picsum.photos/800/500?random=5">
    <img src="https://picsum.photos/800/500?random=1">
    <img src="https://picsum.photos/800/500?random=2">
    <img src="https://picsum.photos/800/500?random=3">
    <img src="https://picsum.photos/800/500?random=4">
    <img src="https://picsum.photos/800/500?random=5">
  </div>
</div>

<!-- Fullscreen -->
<div class="fullscreen" id="fullscreen">
  <span class="close-btn" id="closeBtn">&times;</span>
  <img id="fullImg">
</div>

<script>
const images = document.querySelectorAll(".gallery-track img");
const fullscreen = document.getElementById("fullscreen");
const fullImg = document.getElementById("fullImg");
const closeBtn = document.getElementById("closeBtn");

images.forEach(img => {
  img.addEventListener("click", () => {
    fullscreen.classList.add("active");
    fullImg.src = img.src;
  });
});

closeBtn.addEventListener("click", () => {
  fullscreen.classList.remove("active");
});

fullscreen.addEventListener("click", (e) => {
  if (e.target !== fullImg) {
    fullscreen.classList.remove("active");
  }
});
</script>

</body>
</html>
